name: SauceDemo Playwright Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - stage
      suite:
        description: Suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ inputs.environment }}
      SAUCE_USERNAME: standard_user
      SAUCE_PASSWORD: secret_sauce

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run selected suite
        shell: bash
        run: |
          if [ "${{ inputs.suite }}" = "smoke" ]; then
            npm run test:smoke
          elif [ "${{ inputs.suite }}" = "regression" ]; then
            npm run test:regression
          else
            npm test
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
